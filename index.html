<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E7D32">
<title>社会的視点アセスメント 記録・評価（十日町市）</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script>window.__PWA__=true</script>
<style>
:root{
  --green:#2E7D32; --green2:#5AB556; --lime-l:#EEF7DF; --grn-l:#E3F1E2;
  --yel:#F2C12E; --yel-l:#FFF6CF; --org:#F4511E; --org-l:#FFE0D6; --red:#B23A10;
  --bg:#F4F8EE; --card:#fff; --line:#D6E3CF; --text:#262626; --gray:#5F5F5F; --lgray:#BFBFBF;
  --l1:#C8E6C9; --l1b:#43A047; --l2:#EEF3B0; --l2b:#AFB42B; --l3:#FFE9A8; --l3b:#F9A825; --l4:#FFCDBD; --l4b:#F4511E;
  --na:#ECEFF1; --nab:#90A4AE; --blue-l:#E8F0FE; --blue:#7BA2E0; --blue-d:#1F4E9A;
  --radius:14px; --tap:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--green)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;
  padding:8px 12px;min-height:62px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar .ttl{font-size:18px;font-weight:700;flex:1;min-width:0;line-height:1.25}
.topbar .ttl .sub{display:block;font-size:12.5px;opacity:.92;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:10px;
  padding:0 14px;min-height:var(--tap);font-size:15px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tb-btn.primary{background:var(--yel);color:#333;border-color:var(--yel)}
.tb-btn.rec{background:#fff;color:var(--org);border-color:#fff}
.tb-btn.rec.on{background:var(--org);color:#fff;border-color:var(--org);animation:pulse 1.4s infinite}
.tb-btn.back{min-width:46px;justify-content:center;padding:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,81,30,.5)}70%{box-shadow:0 0 0 10px rgba(244,81,30,0)}100%{box-shadow:0 0 0 0 rgba(244,81,30,0)}}
.steps{position:sticky;top:62px;z-index:19;background:#fff;border-bottom:1.5px solid var(--line);display:flex;gap:4px;padding:6px 12px;overflow-x:auto}
.steps a{flex:1;min-width:120px;text-align:center;text-decoration:none;color:var(--gray);font-weight:700;font-size:15px;padding:8px 6px;border-radius:10px;border:1.5px solid transparent;white-space:nowrap}
.steps a.on{background:var(--green);color:#fff}
.steps a .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--yel);color:#333;align-items:center;justify-content:center;font-size:13px;margin-right:4px}

/* layout */
.wrap{max-width:1500px;margin:0 auto;padding:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:900px){.two{grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr)}}
.recgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:1100px){.recgrid{grid-template-columns:minmax(0,1fr) 310px}.recgrid .side{position:sticky;top:120px;max-height:calc(100vh - 132px);overflow:auto}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.card.head{background:var(--lime-l);border-color:var(--green2)}
.card.yel{background:var(--yel-l);border-color:var(--yel)}
.card.warn{background:#FFF8F4;border-color:var(--org)}
.card h3{font-size:16.5px;color:var(--green);margin-bottom:8px}
.card.warn h3{color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.lbl{font-size:13.5px;color:var(--gray);margin:10px 0 4px;font-weight:700}
.small{font-size:13px;color:var(--gray)}
.b{font-weight:700}
.muted{color:var(--gray)}
hr.sep{border:0;border-top:1px dashed var(--line);margin:10px 0}

/* buttons / chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 16px;border-radius:12px;
  border:1.5px solid var(--green2);background:#fff;color:var(--green);font-weight:700;font-size:15px;white-space:nowrap}
.btn.fill{background:var(--green);color:#fff;border-color:var(--green)}
.btn.yel{background:var(--yel);border-color:var(--yel);color:#333}
.btn.gray{border-color:var(--lgray);color:var(--gray)}
.btn.danger{border-color:var(--org);color:var(--red)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--green2);
  background:#fff;color:var(--text);font-size:15px;line-height:1.2;text-align:left}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip.sm{min-height:32px;font-size:13.5px;padding:2px 11px}
.chip.dash{border-style:dashed;color:var(--gray)}
.chip.red.on{background:var(--red);border-color:var(--red)}
.seg{display:inline-flex;border:1.5px solid var(--green2);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:8px 14px;font-size:14.5px;border-right:1px solid var(--green2);background:#fff;min-height:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--green);color:#fff;font-weight:700}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid;white-space:nowrap}
.b1{background:var(--l1);border-color:var(--l1b);color:#1B5E20}
.b2{background:var(--l2);border-color:var(--l2b);color:#5E6600}
.b3{background:var(--l3);border-color:var(--l3b);color:#7A4F00}
.b4{background:var(--l4);border-color:var(--l4b);color:#8A2500}
.b0{background:var(--na);border-color:var(--nab);color:#455A64}
.bw{background:#fff;border-color:var(--lgray);color:var(--gray)}
.bg{background:var(--grn-l);border-color:var(--green2);color:var(--green)}
input[type=text],input[type=date],input[type=password],input[type=search],textarea,select{width:100%;min-height:var(--tap);padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--green2);outline-offset:0}

/* 6-item cards */
.progress{display:flex;gap:4px;align-items:center}
.progress i{width:20px;height:20px;border-radius:5px;display:inline-block;border:1.5px solid var(--lgray);background:#fff}
.progress i.l1{background:var(--l1b);border-color:var(--l1b)}.progress i.l2{background:var(--l2b);border-color:var(--l2b)}
.progress i.l3{background:var(--l3b);border-color:var(--l3b)}.progress i.l4{background:var(--l4b);border-color:var(--l4b)}
.progress i.na{background:repeating-linear-gradient(45deg,#fff 0 3px,#B0BEC5 3px 6px);border-color:var(--nab)}
.progress i.star{outline:2px solid var(--yel);outline-offset:1px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.item{background:#fff;border:1.5px solid var(--line);border-left:7px solid var(--lgray);border-radius:14px;padding:10px 12px}
.item.k1{border-left-color:var(--l1b)}.item.k2{border-left-color:var(--l2b)}.item.k3{border-left-color:var(--l3b)}.item.k4{border-left-color:var(--l4b)}
.item.kna{border-left-color:var(--nab)}
.item.ikigai{box-shadow:0 0 0 2px var(--yel) inset}
.item .h{display:flex;align-items:center;gap:8px}
.item .num{width:28px;height:28px;border-radius:50%;background:var(--yel);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.item .nm{font-size:17.5px;font-weight:700;color:var(--green);flex:1}
.item .q{font-size:14px;background:var(--yel-l);border-radius:9px;padding:5px 9px;margin:7px 0}
.item .view{font-size:12.5px;color:var(--gray);margin-top:-3px;margin-bottom:6px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lv button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--gray);line-height:1.15;padding:2px}
.lv button.on1{background:var(--l1);border-color:var(--l1b);color:#1B5E20}
.lv button.on2{background:var(--l2);border-color:var(--l2b);color:#5E6600}
.lv button.on3{background:var(--l3);border-color:var(--l3b);color:#7A4F00}
.lv button.on4{background:var(--l4);border-color:var(--l4b);color:#8A2500}
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.src button{min-height:38px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;color:var(--gray)}
.src button.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d);font-weight:700}
.src button.onna{background:var(--na);border-color:var(--nab);color:#37474F;font-weight:700}
.item .det{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.item .more{margin-top:6px;font-size:14px;color:var(--green);font-weight:700;padding:6px 2px}
.item .edit{border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.ikhint{font-size:13px;margin-top:6px;padding:5px 9px;border-radius:8px}
.ikhint.ok{background:var(--grn-l);color:var(--green)}
.ikhint.ng{background:var(--yel-l);color:#7A5A00}

/* side panel */
.side .tabs{display:flex;gap:6px;margin-bottom:8px}
.side .tab{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--green2);background:#fff;color:var(--green);font-weight:700}
.side .tab.on{background:var(--green);color:#fff}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-bottom:1px dashed var(--line);padding:7px 2px;display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.tl .t{font-size:12px;color:var(--gray);min-width:44px;font-variant-numeric:tabular-nums;padding-top:2px}
.tl .t.seek{color:var(--green);font-weight:700;cursor:pointer;text-decoration:underline}
.tl .x{margin-left:auto;color:var(--lgray);font-size:18px;padding:0 6px}
.tl .tag{font-size:12px;color:var(--green);border:1px solid var(--green2);border-radius:6px;padding:0 5px;margin-right:4px;white-space:nowrap}
.interim{color:var(--gray);font-style:italic;font-size:14px}
.recstate{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lgray);display:inline-block}
.dot.on{background:var(--org);animation:pulse 1.4s infinite}

/* lists */
.li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;background:#fff;width:100%;text-align:left}
.li .t{font-size:16px;font-weight:700}
.li .m{font-size:13px;color:var(--gray)}
.due{font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.due.over{background:var(--org-l);color:var(--red);border:1px solid var(--org)}
.due.soon{background:var(--yel-l);color:#7A5A00;border:1px solid var(--yel)}
.due.later{background:#fff;color:var(--gray);border:1px solid var(--lgray)}
.hero{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero b{font-size:52px;line-height:1;font-weight:700}
.hero span{font-size:14px;color:var(--gray);padding-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.tile{background:var(--yel-l);border:1.5px solid var(--yel);border-radius:12px;padding:8px 10px}
.tile b{font-size:24px;display:block;line-height:1.2}
.tile span{font-size:12.5px;color:var(--gray)}
.ref{border:1.5px solid var(--green2);background:var(--lime-l);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.ref .t{font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;margin:6px 0 0}
.kv dt{color:var(--gray)}
.kv dd{margin:0}
.q2{font-size:15px;font-weight:700;margin:12px 0 6px}
.sugg{max-height:260px;overflow:auto;border:1.5px solid var(--line);border-radius:10px;margin-top:6px}
.sugg button{display:block;width:100%;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
.sugg button:hover,.sugg button.on{background:var(--grn-l)}
.sugg .c{font-size:12px;color:var(--gray)}

/* summary */
.sumbox{min-height:420px;font-size:15px;line-height:1.65}
table.mini{border-collapse:collapse;width:100%;font-size:14px}
table.mini td,table.mini th{padding:6px 4px;border-bottom:1px dashed var(--line);vertical-align:top;text-align:left}
.ai{border:1.5px solid var(--blue);background:#F5F9FF;border-radius:12px;padding:10px 12px;margin-top:10px}
.ai h4{color:var(--blue-d);font-size:15px;margin-bottom:4px}
.ai pre{white-space:pre-wrap;font-family:inherit;margin:6px 0;font-size:14.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.notice{background:var(--org-l);border:1.5px solid var(--org);border-radius:10px;padding:8px 12px;font-size:13.5px}
.info{background:var(--grn-l);border:1.5px solid var(--green2);border-radius:10px;padding:8px 12px;font-size:13.5px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.kpi .l{font-size:13.5px;color:var(--gray);font-weight:700}
.kpi .v{font-size:30px;font-weight:700;line-height:1.2}
.kpi .d{font-size:12.5px;color:var(--gray)}
.kpi.main{border-color:var(--green2);background:var(--lime-l);grid-column:span 2}
.kpi.main .v{font-size:50px}
@media(max-width:600px){.kpi.main{grid-column:span 1}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px;margin-top:10px}
.chart{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.chart h4{font-size:15.5px}
.chart .s{font-size:12.5px;color:var(--gray);margin:2px 0 8px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 58px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.hb .tr{height:16px;background:#EEF2EC;border-radius:0 4px 4px 0;position:relative}
.hb .br{height:16px;background:var(--green2);border-radius:0 4px 4px 0;max-width:100%}
.hb .br.hi{background:var(--green)}
.hb .br.dim{background:#A5CFA2}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 4px;border-bottom:1px solid #DADFD6}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:28px}
.cols .c i{display:block;width:100%;max-width:24px;background:var(--green2);border-radius:4px 4px 0 0}
.cols .c b{font-size:12.5px;margin-bottom:3px;font-variant-numeric:tabular-nums}
.colx{display:flex;gap:10px;padding:4px 4px 0}
.colx span{flex:1;text-align:center;font-size:12px;color:var(--gray);min-width:28px}
table.hm{border-collapse:separate;border-spacing:2px;font-size:13px;width:100%}
table.hm th{font-weight:700;color:var(--gray);text-align:center;padding:3px;font-size:12px;vertical-align:bottom}
table.hm th.r{text-align:left;white-space:nowrap}
table.hm td{text-align:center;padding:5px 3px;border-radius:4px;font-variant-numeric:tabular-nums;min-width:34px}
.h0{background:#F3F6F1;color:#aaa}.h1{background:#DCEFD9}.h2{background:#B6DDB1}.h3{background:#7FC377}.h4{background:#43A047;color:#fff}.h5{background:#2E7D32;color:#fff}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px}
.filters select,.filters input{width:auto;min-height:40px}

/* modal / fab / toast / lock */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.modal .box{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.modal .box{border-radius:18px}}
.modal h2{font-size:18px;color:var(--green);margin-bottom:8px}
.fab{position:fixed;right:16px;bottom:16px;z-index:30}
.fab button{min-width:66px;min-height:66px;border-radius:50%;background:var(--yel);color:#333;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);border:2px solid #fff;line-height:1.1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
.lock .box{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:24px;width:320px;text-align:center}
.lock input{font-size:28px;text-align:center;letter-spacing:8px}
.navbtns{display:flex;justify-content:space-between;gap:8px;margin:12px 0 90px;padding-right:84px}

/* print */
#printArea{display:none}
table.sheet{border-collapse:collapse;width:100%;font-size:13px}
table.sheet th,table.sheet td{border:1px solid #999;padding:5px 7px;vertical-align:top;text-align:left}
table.sheet th{background:#E3F1E2}
@media print{
  body{background:#fff}
  #app,.fab,.toast,.modal,.lock{display:none!important}
  #printArea{display:block;font-size:10.5pt;color:#000}
  #printArea h1{font-size:15pt;margin:0 0 6pt}
  #printArea h2{font-size:12pt;margin:10pt 0 4pt;border-left:5px solid #2E7D32;padding-left:6pt}
  #printArea table{page-break-inside:auto}
  #printArea tr{page-break-inside:avoid}
  table.sheet,table.dt{font-size:9.5pt}
  @page{size:A4;margin:13mm}
}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p>読み込み中…</p></div></div>
<div id="printArea"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* =====================================================================
   社会的視点アセスメント 記録・評価（十日町市）v2 ― 通常の地域保健活動版
   - 市作成「社会的視点からみるアセスメントシート」6項目をタップで記録（評価4段階＋把握の仕方）
   - 主指標：生きがい（好きなこと・得意なこと・大切にしていること）を把握できた面談の割合
   - 対応・つなぎ（地域資源ナビの分類・手厚さ3段階・きっかけ項目）、約1か月後の結果（A/B/C）

      if (!db.objectStoreNames.contains('pool')) db.createObjectStore('pool', {keyPath:'id'}); };

  async tx(store, mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, mode); const st = t.objectStore(store); let out; const rq = fn(st); if (rq) rq.onsuccess = () => { out = rq.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },

function monthStats(recs){
  const n = recs.length, ik = recs.filter(ikigaiOK).length, all6 = recs.filter(r => knownCount(r) === 6).length;
  const avg = n ? (recs.reduce((s, r) => s + knownCount(r), 0) / n).toFixed(1) : '—';
  const nf = recs.filter(r => r.reflect.newFind === 'yes').length;
  const refs = recs.flatMap(r => r.refs || []); const con = refs.filter(f => f.status === 'つながった').length;
  return {n, ik, all6, avg, nf, refs: refs.length, con};
}

function openFollow(rid, fid){

      <p><b>${esc(r.caseCode || '番号未入力')}</b>　${fmtYmd(r.date)} ${esc(r.scene)}<br>${esc(f.cat)}${f.name ? '「' + esc(f.name) + '」' : ''}　${esc(f.level || '')}　確認予定 ${fmtYmd(f.due)}</p>
      <div class="lbl">状態</div><div class="chips">${REF_STATUS.map(s => `<button class="chip ${tmp.status === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('')}</div>

      ${tmp.status === 'つながらなかった' ? `<div class="lbl">つながらなかった理由（主なもの1つ）</div><div class="chips">${NOT_REASONS.map(x => `<button class="chip ${tmp.notReason === x.v ? 'on' : ''}" data-nr="${x.v}">${esc(x.label)}</button>`).join('')}</div>` : ''}
      <div class="lbl">確認日</div><input type="date" id="fuDate" value="${esc(tmp.statusDate)}" style="width:200px">
      <div class="lbl">メモ（この端末内のみ。評価用データには含みません）</div><input type="text" id="fuNote" value="${esc(tmp.note)}" placeholder="例：2回参加。畑の話で仲間ができた">
      <div class="row" style="margin-top:14px"><button class="btn fill" id="fuSave">保存</button><button class="btn gray" onclick="closeModal()">キャンセル</button><span class="grow"></span><button class="btn sm" onclick="closeModal();location.hash='#r/${r.id}/2'">記録を開く</button></div>`;
    $$('#modal [data-s]').forEach(b => b.onclick = () => { tmp.status = b.dataset.s; if (tmp.status !== 'つながらなかった') tmp.notReason = ''; keep(); draw(); });
    $$('#modal [data-nr]').forEach(b => b.onclick = () => { tmp.notReason = b.dataset.nr; keep(); draw(); });
    $('#fuSave').onclick = () => {
      keep();
      if (tmp.status === 'つながらなかった' && !tmp.notReason) { toast('つながらなかった理由を選んでください'); return; }
      Object.assign(f, tmp); DB.touch(r); closeModal(); toast('記録しました'); route();
    };
  };
  const keep = () => { const d = $('#fuDate'), n = $('#fuNote'); if (d) tmp.statusDate = d.value; if (n) tmp.note = n.value; };
  openModal(''); draw();
}

function detailText(c, it){ return c.d.map(d => { const v = it.d[d.key]; if (empty(v)) return ''; return d.label + '：' + (Array.isArray(v) ? v.join('・') : v); }).filter(Boolean).join('、'); }
function itemLine(c, it){
  if (it.src === 'na') return `${c.name}：未把握${it.na.length ? '（' + it.na.join('・') + '）' : ''}`;
  if (!it.level) return `${c.name}：未記入`;
  const x = [c.key === 'ikigai' ? '' : detailText(c, it), it.note].filter(Boolean).join('。');
  return `${c.name}：${LEVELS[it.level - 1].label}${it.src === 'prev' ? '［以前から把握］' : ''}${x ? '（' + x + '）' : ''}`;
}
const REF_LV_LABEL = {'即時': '即時つなぎ', '情報提供': '情報提供', '後日': '後日案内'};
function refLine(f, i){
  const bits = [REF_LV_LABEL[f.level] || '', f.status || '', PENDING.includes(f.status) && f.due ? '確認予定 ' + md(f.due) : '', f.notReason ? '理由 ' + f.notReason : ''].filter(Boolean).join('・');
  return `${CIRC[i] || '・'}${f.cat}${f.name ? '「' + f.name + '」' : ''}${bits ? '（' + bits + '）' : ''}`;
}
function autoSummary(r, fmt){
  const head = `【${fmtYmd(r.date)} ${r.scene || '場面未入力'}（${r.visitType}）】${[r.age, r.sex, r.area ? r.area + '地区' : ''].filter(Boolean).join('・')}`;
  const consult = [r.consult.join('・'), r.chief].filter(Boolean).join('／') || '—';
  const items = SHEET.map(c => '・' + itemLine(c, r.items[c.key]));
  const d = r.items.ikigai.d;
  const strengths = [ikigaiWords(r).join('、'), d.yakudatsu ? '人の役に立つ・教える意欲：' + d.yakudatsu : ''].filter(Boolean).join('。') || '未把握';
  const kz = r.kizuki.map(k => k.text).join('。');
  const acts = r.actions.join('、') || '—';
  const refs = r.refs.map(refLine);
  const gap = r.gap.has && r.gap.text ? r.gap.text + (r.gap.area ? '（' + r.gap.area + '）' : '') : '';
  const next = [...r.reflect.nextCheck.map(x => x + 'の確認'), r.reflect.nextText].filter(Boolean).join('、');
  const L = [head];
  if (fmt === 'soap') {
    const soudan = (r.items.kibo.d.soudan || []).filter(x => x !== '特になし');
    L.push(`S：${consult}${soudan.length ? '。相談したいこと：' + soudan.join('・') : ''}`);
    L.push(`O：${[kz, r.memo].filter(Boolean).join('。') || '—'}`);
    L.push(`A：社会的視点アセスメント（${knownCount(r)}/6項目把握）`); items.forEach(x => L.push('　' + x)); L.push(`　生きがい・強み：${strengths}`);
    L.push(`P：対応 ${acts}`); refs.forEach(x => L.push('　つなぎ ' + x)); if (gap) L.push('　見つからなかった資源：' + gap); if (next) L.push('　今後：' + next);
  } else {
    L.push(`【相談内容】${consult}`, `【社会的視点アセスメント（${knownCount(r)}/6項目把握）】`, ...items, `【生きがい・強み】${strengths}`);
    if (kz) L.push(`【気づき】${kz}`);
    if (r.memo) L.push(`【メモ】${r.memo}`);
    L.push(`【対応】${acts}`);
    if (refs.length) { L.push('【つなぎ】'); refs.forEach(x => L.push('　' + x)); }
    if (gap) L.push(`【見つからなかった資源】${gap}`);
    if (next) L.push(`【今後】${next}`);
  }

}

let AUDIO_URLS = [];
async function afterSummary(r){
  const box = $('#audioBox'); if (!box) return;
  if (!r.audio || !r.audio.has) { box.innerHTML = '<p class="small">録音はありません（記録画面の「● 録音」から録音できます）。</p>'; return; }

  const parts = a.parts || [{blob: a.blob, mime: a.mime, duration: a.duration, offset: 0}];
  AUDIO_URLS.forEach(u => URL.revokeObjectURL(u)); AUDIO_URLS = [];
  box.innerHTML = parts.map((p, i) => { const u = URL.createObjectURL(p.blob); AUDIO_URLS.push(u);
      return `${parts.length > 1 ? `<div class="small">録音${i + 1}（${fmtSec(p.offset)}〜）</div>` : ''}<audio controls preload="metadata" src="${u}" data-off="${p.offset || 0}" style="width:100%"></audio>`; }).join('')

function seekAudio(sec){
  const auds = $$('#audioBox audio');
  if (!auds.length) { toast('録音の再生はサマリー画面で行えます'); return; }
  let target = auds[0]; auds.forEach(x => { if (+x.dataset.off <= sec) target = x; });
  auds.forEach(x => { if (x !== target) x.pause(); });
  target.currentTime = Math.max(0, sec - (+target.dataset.off) - 8); target.play();
}
async function exportAudio(id){
  const a = await IDB.get('audio', id); if (!a) return; const r = DB.get(id);
  const parts = a.parts || [{blob: a.blob, mime: a.mime}];
  parts.forEach((p, i) => { const ext = (p.mime || '').includes('mp4') ? 'm4a' : (p.mime || '').includes('ogg') ? 'ogg' : 'webm';
    download(`録音_${(r.caseCode || id)}_${r.date.replace(/-/g, '')}${parts.length > 1 ? '_' + (i + 1) : ''}.${ext}`, p.blob); });
}

/* ---------------- 持ち帰り文字起こし（端末内で処理・外部に音声を送らない） ----------------
   録音ファイルを、タブレットのブラウザ内で動く音声認識モデル（Whisper 系）で文字にする。
   モデルは初回のみダウンロード（市役所の Wi-Fi で）し、以後は端末内に保存されるため圏外でも動く。 */
const TFJS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1';

  kotoba: {label: '日本語特化（kotoba-whisper v2.2）', id: 'onnx-community/kotoba-whisper-v2.2-ONNX', size: '約730MB',
    webgpu: {encoder_model: 'q4', decoder_model_merged: 'q4'}, wasm: null, note: '精度が高い。WebGPU 対応端末のみ。処理に時間がかかる'},
  small: {label: '標準（whisper-small）', id: 'onnx-community/whisper-small', size: '約250〜400MB',
    webgpu: {encoder_model: 'fp16', decoder_model_merged: 'q4'}, wasm: {encoder_model: 'q8', decoder_model_merged: 'q8'}, note: '精度と速さのバランス'},
  base: {label: '軽量（whisper-base）', id: 'onnx-community/whisper-base', size: '約100MB',
    webgpu: {encoder_model: 'fp16', decoder_model_merged: 'q4'}, wasm: {encoder_model: 'q8', decoder_model_merged: 'q8'}, note: '速いが精度は低め。動作確認用'}
};
const ASR_WORKER_SRC = `
let T = null, pipe = null, cfg = '';
async function lib(){ if (!T) T = await import('${TFJS_URL}'); return T; }
self.onmessage = async (e) => {
  const {type, id} = e.data;
  try {
    if (type === 'load') {
      const {model, device, dtype} = e.data;
      const {pipeline} = await lib();
      const key = model + '|' + device + '|' + JSON.stringify(dtype);
      if (!pipe || cfg !== key) {
        if (pipe) { try { await pipe.dispose(); } catch(_){} pipe = null; }
        pipe = await pipeline('automatic-speech-recognition', model, {device, dtype, progress_callback: p => self.postMessage({type: 'progress', id, p})});
        cfg = key;
      }
      self.postMessage({type: 'loaded', id});
    } else if (type === 'run') {
      const {audio, offset} = e.data;
      const {WhisperTextStreamer} = await lib();
      let streamer;
      try { streamer = new WhisperTextStreamer(pipe.tokenizer, {skip_prompt: true,
        on_chunk_start: t => self.postMessage({type: 'chunk', id, t}),
        callback_function: text => self.postMessage({type: 'partial', id, text})}); } catch(_){ streamer = undefined; }
      const out = await pipe(audio, {language: 'japanese', task: 'transcribe', return_timestamps: true, chunk_length_s: 30, stride_length_s: 5, streamer});
      self.postMessage({type: 'result', id, text: out.text || '', chunks: (out.chunks || []).map(c => ({ts: c.timestamp, text: c.text})), offset});
    }
  } catch(err){ self.postMessage({type: 'error', id, message: String(err && err.message || err)}); }
};`;
const ASR = {worker: null, busy: false, pending: null};
function asrDevice(){ const d = DB.settings.asrDevice || 'auto'; if (d !== 'auto') return d; return navigator.gpu ? 'webgpu' : 'wasm'; }
function asrPreset(){ return ASR_MODELS[DB.settings.asrModel] || ASR_MODELS.small; }
function asrWorker(){
  if (!ASR.worker) { const blob = new Blob([ASR_WORKER_SRC], {type: 'text/javascript'}); ASR.worker = new Worker(URL.createObjectURL(blob), {type: 'module'}); }
  return ASR.worker;
}
function asrCall(msg, onProgress, transfer){
  return new Promise((res, rej) => {
    const id = uid(), w = asrWorker();
    const h = e => { const d = e.data; if (!d || d.id !== id) return;
      if (d.type === 'progress' || d.type === 'chunk' || d.type === 'partial') { if (onProgress) onProgress(d); return; }
      w.removeEventListener('message', h); ASR.pending = null;
      if (d.type === 'error') rej(new Error(d.message)); else res(d); };
    w.addEventListener('message', h);
    ASR.pending = () => { w.removeEventListener('message', h); rej(new Error('中止しました')); };

function asrCancel(){ if (ASR.worker) { ASR.worker.terminate(); ASR.worker = null; } if (ASR.pending) ASR.pending(); ASR.busy = false; }
async function asrLoad(onProgress){

/* 録音（webm/opus 等）を 16kHz モノラルの波形に変換 */
async function decodeTo16k(blob){
  const ab = await blob.arrayBuffer();
  const ctx = new OfflineAudioContext(1, 16000, 16000);
  const buf = await ctx.decodeAudioData(ab);
  const ch = buf.numberOfChannels;
  if (ch === 1) return buf.getChannelData(0);
  const data = new Float32Array(buf.length);
  for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) data[i] += d[i] / ch; }
  return data;
}
async function asrCachedFiles(modelId){
  try { if (!window.caches) return -1; const c = await caches.open('transformers-cache'); const keys = await c.keys(); return keys.filter(k => k.url.includes(modelId)).length; } catch(e){ return -1; }
}
function asrProgressText(d){
  const p = d.p;
  if (!p) return '';
  if (p.status === 'progress' || p.status === 'progress_total') return `モデルを読み込み中：${p.file ? p.file.split('/').pop() : ''} ${Math.round(p.progress || 0)}%`;
  if (p.status === 'initiate' || p.status === 'download') return `モデルを読み込み中：${p.file || ''}`;
  if (p.status === 'ready') return 'モデルの準備ができました';
  return '';
}

/* 記録の録音をまとめて文字起こしする */
async function transcribeRecording(id){
  const r = DB.get(id); if (!r || !r.audio || !r.audio.has) { toast('録音がありません'); return; }
  if (ASR.busy) { toast('別の文字起こしを処理中です'); return; }
  if (r.transcript.length && !confirm(`会話の記録が ${r.transcript.length} 行あります。端末内の文字起こしで置き換えますか？`)) return;
  const a = await IDB.get('audio', r.id).catch(() => null); if (!a) { toast('録音データが見つかりません'); return; }
  const parts = a.parts || [{blob: a.blob, mime: a.mime, duration: a.duration, offset: 0}];
  const total = parts.reduce((s, p) => s + (p.duration || 0), 0);
  ASR.busy = true; keepAwake(true); const t0 = Date.now();   // 処理中は画面を消さない（録音と同じ仕組み）
  const timer = setInterval(() => { const el = $('#asrElapsed'); if (el) el.textContent = '経過 ' + fmtSec((Date.now() - t0) / 1000); }, 1000);
  const show = (status, pct, partial) => asrBox(`<div class="info"><b>${esc(status)}</b> <span id="asrElapsed" class="small">経過 ${fmtSec((Date.now() - t0) / 1000)}</span>
    <div class="hb" style="grid-template-columns:1fr 50px;margin:6px 0 2px"><div class="tr"><div class="br" style="width:${Math.round(pct)}%"></div></div><span class="n">${Math.round(pct)}%</span></div>
    ${partial ? `<div class="small" style="max-height:60px;overflow:hidden">${esc(partial.slice(-120))}</div>` : ''}
    <div class="row" style="margin-top:6px"><button class="btn sm danger" onclick="asrCancel();asrBox('<p class=small>中止しました。</p>')">中止</button><span class="small">画面はこのままにしてください（他の記録の入力は可能です）</span></div></div>`);
  try {
    show('モデルを準備しています（初回はダウンロードに時間がかかります）', 0);
    const {m, dev} = await asrLoad(d => { const t = asrProgressText(d); if (t) show(t, d.p && d.p.progress ? d.p.progress * 0.3 : 0); });
    const lines = []; let done = 0, partial = '';

      const p = parts[i];
      show(`録音${parts.length > 1 ? i + 1 : ''}を読み込み中`, 30 + done / total * 70);
      const audio = await decodeTo16k(p.blob);
      const dur = audio.length / 16000;
      const res = await asrCall({type: 'run', audio, offset: p.offset || 0}, d => {
        if (d.type === 'chunk') show(`文字起こし中（${m.label.split('（')[0]}・${dev === 'webgpu' ? 'GPU' : 'CPU'}）`, 30 + (done + Math.min(d.t || 0, dur)) / total * 70, partial);
        else if (d.type === 'partial') { partial += d.text; show('文字起こし中', 30 + done / total * 70, partial); }
      }, [audio.buffer]);

    asrBox(`<div class="info">文字起こしが終わりました（${lines.length}行・${fmtSec((Date.now() - t0) / 1000)}）。内容を確認し、必要なら AI 要約へ進んでください。</div>`);

    if (CUR === r && UI.step === 4) setTimeout(() => rerender(), 800);
  } catch(e){
    asrBox(`<div class="notice">文字起こしに失敗しました：${esc(e.message)}<br>ネット接続がある場所で「設定」→「文字起こしモデルをダウンロード」を先に行うと確実です。</div>`);
  } finally { clearInterval(timer); ASR.busy = false; if (!REC.on) keepAwake(false); }
}

function parsePastedAI(text){
  const out = {keika: '', ikigai: [], strengths: [], concerns: [], item_notes: [], next_steps: []};

    const sec = AI_SECTIONS.find(([h]) => h === m[1]); if (!sec) return;

  const btn = $('#aiBtn'); if (btn) { btn.disabled = true; btn.textContent = 'AI が要約しています…（数十秒かかることがあります）'; }
  try {
    const {out, model} = prov === 'openai' ? await aiOpenAI(r, st) : await aiAnthropic(r, st);
    saveAI(r, out, model);

/* Anthropic（Claude）API：公式 SDK をブラウザで利用 */
async function aiAnthropic(r, st){
  let Anthropic = null;
  try { ({default: Anthropic} = await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm')); }
  catch(e){ throw new Error('AI 機能を読み込めませんでした（ネット接続を確認してください）'); }
  try {
    const client = new Anthropic({apiKey: st.apiKey, dangerouslyAllowBrowser: true});
    const res = await client.beta.messages.create({
      model: st.model || 'claude-opus-5-5',
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: {effort: st.effort || 'medium', format: {type: 'json_schema', schema: AI_SCHEMA}},
      system: AI_SYSTEM,
      messages: [{role: 'user', content: '次の面談記録を整理してください。\n' + JSON.stringify(aiPayload(r), null, 1)}]
    });
    if (res.stop_reason === 'refusal') throw new Error('AI がこの内容の要約を行いませんでした');
    if (res.stop_reason === 'max_tokens') throw new Error('出力が長すぎて途中で止まりました');
    const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
    return {out: JSON.parse(text), model: res.model || st.model};
  } catch(e){
    if (e instanceof Anthropic.AuthenticationError) throw new Error('API キーが正しくありません');
    if (e instanceof Anthropic.PermissionDeniedError) throw new Error('この API キーでは利用できません');
    if (e instanceof Anthropic.RateLimitError) throw new Error('混み合っています。少し待ってから再実行してください');
    if (e instanceof Anthropic.APIConnectionError) throw new Error('AI サービスに接続できませんでした');
    if (e instanceof Anthropic.APIError) throw new Error(`AI サービスのエラー（${e.status}）`);
    throw e;
  }
}
/* 市の AI 基盤（OpenAI 互換の chat completions／Azure OpenAI） */
async function aiOpenAI(r, st){
  const headers = {'content-type': 'application/json'};
  if (st.aiAuth === 'api-key') headers['api-key'] = st.apiKey; else headers['authorization'] = 'Bearer ' + st.apiKey;
  const messages = [{role: 'system', content: AI_SYSTEM + '\n' + AI_JSON_INSTR}, {role: 'user', content: '次の面談記録を整理してください。\n' + JSON.stringify(aiPayload(r), null, 1)}];
  const call = async (withFormat) => {
    const body = {messages, temperature: 0.2};
    if (st.model) body.model = st.model;
    if (withFormat) body.response_format = {type: 'json_object'};
    const res = await fetch(st.aiEndpoint.trim(), {method: 'POST', headers, body: JSON.stringify(body)});
    return res;
  };
  let res;
  try { res = await call(true); if (res.status === 400) res = await call(false); }
  catch(e){ throw new Error('AI 基盤に接続できませんでした（URL とネット接続を確認してください）'); }
  if (res.status === 401 || res.status === 403) throw new Error('API キーが正しくないか、利用が許可されていません');
  if (!res.ok) throw new Error(`AI 基盤のエラー（${res.status}）`);
  const data = await res.json();
  const text = data && data.choices && data.choices[0] && data.choices[0].message ? (data.choices[0].message.content || '') : '';
  if (!text) throw new Error('AI 基盤から回答が返りませんでした');
  let out;
  try { out = parseLooseJSON(text); } catch(e){ out = {keika: text, ikigai: [], strengths: [], concerns: [], item_notes: [], next_steps: []}; }
  ['ikigai', 'strengths', 'concerns', 'item_notes', 'next_steps'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (typeof out.keika !== 'string') out.keika = String(out.keika || '');
  return {out, model: (data.model || st.model || '') + '（市の AI 基盤）'};
}

    c.d.forEach(x => { if (x.type !== 'text' && !empty(it.d[x.key])) d[x.key] = clone(it.d[x.key]); });
    items[c.key] = {level: it.level, src: it.src, na: clone(it.na || []), d}; });

    caseHash: r.caseCode ? (await sha('case:' + r.caseCode)).slice(0, 16) : '', visitType: r.visitType, scene: r.scene,
    fields: clone(r.fields), consult: clone(r.consult), age: r.age, sex: r.sex, area: r.area, items,
    ikigaiContent: ikigaiContent(r), actions: clone(r.actions),
    refs: r.refs.map(f => ({cat: f.cat, name: f.name, navNo: f.navNo || '', level: f.level, triggers: clone(f.triggers || []), due: f.due, status: f.status, statusDate: f.statusDate || '', notReason: f.notReason || ''})),
    gap: r.gap.has ? {has: true, text: r.gap.text, cat: r.gap.cat, area: r.gap.area} : {has: false},
    reflect: {newFind: r.reflect.newFind, newItems: clone(r.reflect.newItems), reflected: r.reflect.reflected, share: !!r.reflect.share},
    activeMs: r.activeMs || 0, hasAudio: !!(r.audio && r.audio.has), transcriptLines: r.transcript.length, usedAI: !!r.usedAI};
}

async function importFiles(inp){
  const files = Array.from(inp.files || []); if (!files.length) return;
  let nEval = 0, nRec = 0, bad = 0;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      if (d.app === 'sva2-eval') {
        for (const e of d.records || []) { if (!e.id) continue; e._src = {device: d.device, exportedAt: d.exportedAt, file: f.name}; await IDB.put('pool', e); nEval++; }
      } else if (d.app === 'sva2-backup') {
        if (!confirm(`${f.name} はバックアップです。この端末の記録として復元しますか？\n（同じ記録は新しい方を残します）`)) continue;
        for (const r of d.records || []) { const cur = DB.get(r.id); if (!cur) { DB.records.push(r); await IDB.put('records', r); nRec++; } else if ((r.updatedAt || 0) > (cur.updatedAt || 0)) { Object.assign(cur, r); await IDB.put('records', clone(cur)); nRec++; } }
      } else bad++;
    } catch(e){ bad++; }
  }
  DB.pool = await IDB.all('pool'); DB.sort();
  toast(`読み込み：評価用データ ${nEval}件${nRec ? '・記録 ' + nRec + '件' : ''}${bad ? '（読めないファイル ' + bad + '件）' : ''}`);
  inp.value = ''; route();
}

async function dashData(){
  const own = [];
  for (const r of DB.records) own.push(await toEval(r));
  const ids = new Set(own.map(e => e.id));
  let E = own.concat(DASH.incPool ? DB.pool.filter(e => !ids.has(e.id)) : []);

    && (!DASH.field || (e.fields || []).includes(DASH.field)) && (!DASH.nurse || e.nurse === DASH.nurse) && (!DASH.doneOnly || e.status === 'done'));
  return {E, all};

function metrics(E){
  const n = E.length, M = {n};
  M.ik = E.filter(eIkigai).length; M.ikNow = E.filter(e => eIkigai(e) && e.items.ikigai.src === 'now').length;
  M.all6 = E.filter(e => eKnownCount(e) === 6).length;
  M.avg = n ? E.reduce((s, e) => s + eKnownCount(e), 0) / n : 0;
  M.dist = [0, 1, 2, 3, 4, 5, 6].map(k => E.filter(e => eKnownCount(e) === k).length);
  M.item = SHEET.map(c => ({c, known: E.filter(e => eKnown(e, c.key)).length, na: E.filter(e => e.items[c.key].src === 'na').length,
    reasons: NA_REASONS.map(x => [x, E.filter(e => e.items[c.key].src === 'na' && (e.items[c.key].na || []).includes(x)).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]),
    lv: [1, 2, 3, 4].map(l => E.filter(e => eKnown(e, c.key) && e.items[c.key].level === l).length)}));
  M.nfAns = E.filter(e => e.reflect.newFind).length; M.nf = E.filter(e => e.reflect.newFind === 'yes').length;
  M.rfAns = E.filter(e => e.reflect.reflected).length; M.rf = E.filter(e => e.reflect.reflected === 'yes').length;
  M.newItems = SHEET.map(c => [c, E.filter(e => (e.reflect.newItems || []).includes(c.key)).length]);
  const refs = E.flatMap(e => e.refs.map(f => Object.assign({e}, f)));
  M.refs = refs; M.withRef = E.filter(e => e.refs.length).length;
  M.con = refs.filter(f => f.status === 'つながった').length;
  M.not = refs.filter(f => f.status === 'つながらなかった');
  M.pend = refs.filter(f => PENDING.includes(f.status)).length;
  M.reasons = NOT_REASONS.map(x => [x, M.not.filter(f => f.notReason === x.v).length]);
  M.levels = REF_LEVELS.map(x => [x, refs.filter(f => f.level === x.v).length]);
  M.ikRefs = refs.filter(f => (f.triggers || []).includes('ikigai'));
  M.cats = REF_CATS.map(c => [c, refs.filter(f => f.cat === c).length]).filter(x => x[1]);
  M.cross = SHEET.map(c => REF_CATS.map(cat => refs.filter(f => f.cat === cat && (f.triggers || []).includes(c.key)).length));
  M.crossCols = REF_CATS.map((cat, j) => [cat, j]).filter(([cat, j]) => M.cross.some(row => row[j]));
  M.gaps = E.filter(e => e.gap && e.gap.has).map(e => Object.assign({date: e.date}, e.gap));
  const suki = {}; E.filter(eIkigai).forEach(e => ((e.items.ikigai.d || {}).suki || []).forEach(s => { suki[s] = (suki[s] || 0) + 1; }));
  M.suki = Object.entries(suki).sort((a, b) => b[1] - a[1]);
  const months = [...new Set(E.map(e => e.date.slice(0, 7)))].sort();
  M.months = months.map(m => { const X = E.filter(e => e.date.startsWith(m)); return {m, n: X.length, ik: X.filter(eIkigai).length, all6: X.filter(e => eKnownCount(e) === 6).length}; });
  M.scenes = SCENES.map(s => { const X = E.filter(e => e.scene === s); return {s, n: X.length, ik: X.filter(eIkigai).length}; }).filter(x => x.n);
  M.fields = FIELDS.map(s => { const X = E.filter(e => (e.fields || []).includes(s)); return {s, n: X.length, ik: X.filter(eIkigai).length}; }).filter(x => x.n);
  M.nurses = new Set(E.map(e => e.nurse).filter(Boolean)).size; M.devices = new Set(E.map(e => e.device).filter(Boolean)).size;
  M.persons = new Set(E.map(e => e.caseHash).filter(Boolean)).size;
  const act = E.map(e => e.activeMs).filter(x => x > 0).sort((a, b) => a - b);

  M.audio = E.filter(e => e.hasAudio).length; M.ai = E.filter(e => e.usedAI).length; M.share = E.filter(e => e.reflect.share).length;
  return M;
}

      <div class="lbl">接続先</div><div class="chips">${Object.entries(AI_PROVIDERS).map(([k, l]) => `<button class="chip sm ${(st.aiProvider || 'anthropic') === k ? 'on' : ''}" onclick="DB.settings.aiProvider='${k}';DB.saveSettings();renderSettings()">${esc(l)}</button>`).join('')}</div>
      ${(st.aiProvider || 'anthropic') === 'anthropic' ? `<div class="lbl">API キー（この端末内にのみ保存。バックアップには含めません）</div><input type="password" id="sKey" value="${esc(st.apiKey)}" placeholder="sk-ant-…" autocomplete="off">
        <div class="row" style="gap:12px"><div class="grow"><div class="lbl">モデル</div><input type="text" id="sModel" value="${esc(st.model)}"></div>
          <div><div class="lbl">思考の深さ（effort）</div><select id="sEffort">${['low', 'medium', 'high'].map(x => `<option ${st.effort === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
        <p class="small">既定：claude-opus-5-5・medium。API キーは端末ごとに発行し、利用上限を設定しておくと安心です。</p>` : ''}
      ${st.aiProvider === 'openai' ? `<div class="lbl">エンドポイント URL（chat completions の完全な URL）</div><input type="text" id="sEndpoint" value="${esc(st.aiEndpoint || '')}" placeholder="例：https://.../v1/chat/completions　または Azure の .../openai/deployments/xxx/chat/completions?api-version=..." autocomplete="off">
        <div class="row" style="gap:12px"><div class="grow"><div class="lbl">API キー（この端末内にのみ保存）</div><input type="password" id="sKey" value="${esc(st.apiKey)}" autocomplete="off"></div>
          <div><div class="lbl">キーの送り方</div><select id="sAuth"><option value="bearer" ${st.aiAuth !== 'api-key' ? 'selected' : ''}>Authorization: Bearer</option><option value="api-key" ${st.aiAuth === 'api-key' ? 'selected' : ''}>api-key ヘッダー（Azure）</option></select></div></div>
        <div class="lbl">モデル名（サービスが要求する場合）</div><input type="text" id="sModel" value="${esc(st.model)}">
        <p class="small">市の AI 基盤が OpenAI 互換または Azure OpenAI 形式の API を提供している場合に使えます。このタブレットからその URL に接続できる必要があります（接続の確認はサマリー画面の「AI で要約」で行えます）。</p>` : ''}
      ${st.aiProvider === 'paste' ? `<p class="small">API キーは不要です。サマリー画面で「依頼文をコピー」→ 市の生成AI（チャット画面）に貼り付けて回答を得る → 回答をアプリに貼り付けて取り込みます。市のツールの利用ルールに従ってください。</p>` : ''}
    </div>
    <div class="card"><h3>画面ロック</h3>
      <p class="small">アプリを開くとき、一定時間操作がないとき、別のアプリから戻ったときに4桁の番号を求めます。端末自体の画面ロックと併用してください。</p>
      <div class="row"><input type="password" inputmode="numeric" maxlength="4" id="sPin" placeholder="4桁" style="width:140px" autocomplete="off"><button class="btn sm fill" onclick="setPin()">設定</button><button class="btn sm gray" onclick="DB.settings.pinHash='';DB.saveSettings();toast('ロックを解除しました');renderSettings()">解除</button>
        <span class="small">${st.pinHash ? '現在：設定済み' : '現在：未設定'}</span></div>
      <div class="lbl">自動ロックまでの時間</div><div class="chips">${[3, 5, 10, 30].map(m => `<button class="chip sm ${st.lockMin === m ? 'on' : ''}" onclick="DB.settings.lockMin=${m};DB.saveSettings();renderSettings()">${m}分</button>`).join('')}</div>
    </div>
    <div class="card"><h3>データ</h3>
      <p class="small">記録 ${DB.records.length}件（うちサンプル ${nSample}件）・他端末の評価用データ ${DB.pool.length}件。保存領域：${esc(persist)}${usage ? '・' + usage : ''}</p>
      <div class="row"><button class="btn sm" onclick="exportEval()">評価用データを書き出す</button><button class="btn sm" onclick="exportBackup()">バックアップ（全記録）</button>
        <label class="btn sm" style="cursor:pointer">読み込み（評価用データ・バックアップ）<input type="file" accept=".json,application/json" multiple class="hidden" onchange="importFiles(this)"></label></div>
      <p class="small">評価用データ：選択項目・日付・つなぎ先の名称・見つからなかった資源の内容のみ。メモ・気づき・サマリー・文字起こし・録音は含みません。記録番号は復元できない形（ハッシュ）に変換します。<br>バックアップ：この端末の全記録（録音を除く）。端末の入れ替えや故障に備えて月1回程度保存してください。</p>
      <hr class="sep">
      <div class="row"><button class="btn sm" onclick="makeSamples();renderSettings()">サンプルデータを作成（架空・研修用）</button>${nSample ? `<button class="btn sm danger" onclick="removeSamples()">サンプルを削除</button>` : ''}<button class="btn sm danger" onclick="wipeAll()">すべての記録を削除</button></div>
    </div>
    <div class="row" style="margin:8px 0 40px"><button class="btn fill" onclick="saveSettings()">保存してホームへ</button></div>
  </div>`;
}
function saveSettings(){
  const st = DB.settings;
  st.nurse = $('#sNurse').value.trim(); st.nurses = $('#sNurses').value.trim(); st.device = $('#sDevice').value.trim() || st.device;
  st.naviUrl = $('#sNavi').value.trim();
  const g = id => $(id) ? $(id).value.trim() : null;
  if (g('#sKey') !== null) st.apiKey = g('#sKey');
  if (g('#sModel') !== null) st.model = g('#sModel') || (st.aiProvider === 'anthropic' ? 'claude-opus-5-5' : '');
  if (g('#sEffort') !== null) st.effort = g('#sEffort');
  if (g('#sEndpoint') !== null) st.aiEndpoint = g('#sEndpoint');
  if (g('#sAuth') !== null) st.aiAuth = g('#sAuth');
  DB.saveSettings(); toast('保存しました'); location.hash = '#home';
}
async function setPin(){ const p = $('#sPin').value; if (!/^\d{4}$/.test(p)) { toast('4桁の数字を入力してください'); return; } DB.settings.pinHash = await hashPin(p); DB.saveSettings(); toast('ロックを設定しました'); renderSettings(); }
async function installLocalSR(){
  try { const ok = await SRClass.install({langs: ['ja-JP'], processLocally: true}); toast(ok ? '日本語の音声認識データを入れました' : '入れられませんでした（この端末では非対応の可能性があります）'); }
  catch(e){ toast('この端末では端末内の音声認識を使えません'); }
}
async function wipeAll(){
  if (!confirm('この端末のすべての記録と録音を削除します。元に戻せません。よろしいですか？')) return;
  if (!confirm('本当に削除しますか？（先にバックアップを書き出すことをお勧めします）')) return;
  await IDB.clear('records'); await IDB.clear('audio'); DB.records = []; toast('削除しました'); location.hash = '#home';
}
async function removeSamples(){
  const ids = DB.records.filter(r => r.sample).map(r => r.id);
  for (const id of ids) await DB.remove(id);
  toast(ids.length + '件のサンプルを削除しました'); renderSettings();
}

/* ---------------- サンプルデータ（架空・研修と画面確認用） ---------------- */
function makeSamples(silent){
  if (!silent && DB.records.some(r => r.sample) && !confirm('サンプルはすでにあります。さらに追加しますか？')) return;
  let seed = 20260929; const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const some = (a, k) => { const s = new Set(); const m = 1 + Math.floor(rnd() * k); while (s.size < m) s.add(pick(a)); return [...s]; };
  const t = today(), fy = fiscalYear(t);
  const months = [0, 1, 2, 3, 4, 5].map(i => { const d = new Date(fy, 3 + i, 1); return ymd(d).slice(0, 7); }).filter(m => m <= t.slice(0, 7));
  const scenes = ['家庭訪問', '家庭訪問', '家庭訪問', '来所相談（窓口）', '電話相談', '健診事後指導', '地区の健康相談', '妊産婦・新生児・乳児訪問', '通いの場・集団活動'];
  const gapsTxt = [['冬期に送迎付きで通える集まり', '交流・居場所'], ['男性が参加しやすい平日の場', '趣味・文化活動'], ['夕方以降の子育て中の親の集まり', '子育て・家庭支援'], ['少額で使える買い物の送迎', '生活支援']];
  const names = NAVI && NAVI.items ? NAVI.items : [];
  let made = 0;
  months.forEach((m, mi) => {
    const nm = 5 + Math.floor(rnd() * 4);
    for (let i = 0; i < nm; i++) {
      const r = DB.newRecord(); r.sample = true; made++;
      const day = pad(1 + Math.floor(rnd() * 27));
      r.date = `${m}-${day}` > t ? t : `${m}-${day}`;
      r.caseCode = 'S-' + String(100 + Math.floor(rnd() * 60)); r.nurse = pick(['A-01', 'A-02', 'A-03', 'B-01', 'B-02']); r.device = pick(['推進課-01', '推進課-02', '推進課-03']);
      r.scene = pick(scenes);
      const boshi = r.scene === '妊産婦・新生児・乳児訪問';
      r.age = boshi ? '20〜39歳' : pick(['40〜64歳', '65〜74歳', '75〜84歳', '75〜84歳', '85歳〜']);
      r.sex = boshi ? '女性' : pick(['男性', '女性', '女性']); r.area = pick(AREAS.slice(0, 13));
      r.fields = boshi ? ['母子保健（妊娠・出産・育児）'] : [pick(['高齢者・介護予防', '成人・生活習慣病', '重症化予防', '精神保健', '高齢者・介護予防'])];
      r.consult = boshi ? ['育児・子どもの発達'] : some(['体の不調・病気', '健診結果・生活習慣', 'こころの不調・不眠', '介護・認知症', '孤立・人づきあい', '生活・お金'], 2);
      const learn = 0.45 + mi * 0.09;   // 月を追うごとに把握が進む想定
      SHEET.forEach(c => {
        const it = r.items[c.key];
        const p = c.key === 'keizai' ? learn - 0.2 : c.key === 'ikigai' ? learn : learn + 0.25;
        if (rnd() < p) { it.level = 1 + Math.floor(rnd() * 4); it.src = rnd() < 0.2 ? 'prev' : 'now'; }
        else if (rnd() < 0.7) { it.src = 'na'; it.na = [pick(c.key === 'keizai' ? ['話題にしにくかった', '話題にしにくかった', '時間が足りなかった'] : NA_REASONS)]; }
      });
      if (isKnown(r.items.ikigai)) { r.items.ikigai.d.suki = some(boshi ? ['料理・食', '音楽・カラオケ', '家族・孫・子ども', '散歩・自然', '読書・学び'] : ['畑・園芸', '料理・食', '音楽・カラオケ', '民謡・踊り', '散歩・自然', 'おしゃべり', '家族・孫・子ども', '手芸・工作', '囲碁・将棋', '旅行・温泉'], 2); if (rnd() < .4) r.items.ikigai.d.tokui = pick(['漬物づくり', '木工', '昔の話', '裁縫', '野菜づくり']); }
      if (isKnown(r.items.tsunagari)) { r.items.tsunagari.d.setai = pick(['独居', '夫婦のみ', '家族と同居']); r.items.tsunagari.d.hindo = pick(['毎日', '週に数回', '週1回程度', '月に数回']); }
      r.actions = some(ACTIONS, 3);
      r.reflect.newFind = rnd() < 0.55 ? 'yes' : 'no'; if (r.reflect.newFind === 'yes') r.reflect.newItems = [pick(['ikigai', 'katsudo', 'keizai', 'tsunagari'])];
      r.reflect.reflected = rnd() < 0.7 ? 'yes' : 'no';
      if (rnd() < 0.4) {
        const trig = SHEET.filter(c => r.items[c.key].level >= 3).map(c => c.key); if (ikigaiOK(r)) trig.push('ikigai');
        const cat = boshi ? '子育て・家庭支援' : pick(['高齢者の通いの場', '交流・居場所', '趣味・文化活動', '運動・健康づくり', 'ボランティア・担い手', '生活支援', '相談窓口']);
        const cand = names.filter(x => x.cats.includes(cat)); const nv = cand.length ? pick(cand) : null;
        const f = {id: uid(), cat, name: nv ? nv.name : '', navNo: nv ? nv.no : '', level: pick(['即時', '情報提供', '情報提供', '後日']), triggers: trig.length ? trig.slice(0, 2) : ['tsunagari'], due: addDays(r.date, 30), status: '提案済み', statusDate: '', notReason: '', note: ''};
        if (addDays(r.date, 30) < t) { const x = rnd(); if (x < 0.55) f.status = 'つながった'; else if (x < 0.85) { f.status = 'つながらなかった'; f.notReason = pick(['A', 'B', 'B', 'C']); } else f.status = '確認中'; f.statusDate = addDays(r.date, 32); }
        r.refs.push(f);
      }
      if (rnd() < 0.12) { const g = pick(gapsTxt); r.gap = {has: true, text: g[0], cat: g[1], area: r.area}; }
      r.reflect.share = rnd() < 0.08;
      r.activeMs = Math.round((120 + rnd() * 300) * 1000);
      r.status = 'done'; r.completedAt = Date.now();
      DB.persist(r, true);
    }
  });
  makeShowcase();
  DB.sort(); toast(`架空のサンプルを${made + 2}件作成しました`);
}
/* 説明用の詳しいサンプル（架空）：同じ人の初回と2回目 */

  const t = today(), d0 = addDays(t, -21);
  const p = DB.newRecord(); Object.assign(p, {sample: true, showcase: true, caseCode: 'K-0412', date: d0, scene: '来所相談（窓口）', visitType: '初回', fields: ['高齢者・介護予防'], consult: ['体の不調・病気'],
    chief: '膝の痛み', age: '75〜84歳', sex: '女性', area: '松代', actions: ['傾聴・助言', '継続支援・次回訪問の約束'], status: 'done', completedAt: Date.now(), activeMs: 150000});

  const r = DB.newRecord(); Object.assign(r, {sample: true, showcase: true, caseCode: 'K-0412', date: t, scene: '家庭訪問', visitType: '継続', fields: ['高齢者・介護予防'], consult: ['体の不調・病気', '孤立・人づきあい'],
    chief: '膝の痛みと冬の通院の不安', age: '75〜84歳', sex: '女性', area: '松代',
    actions: ['傾聴・助言', '情報提供（資料）', '他機関・他課へ連絡', '地域資源の紹介'], activeMs: 230000, memo: '台所に漬物樽が3つ。手入れが行き届いている。'});
  Object.assign(r.items.tsunagari, {level: 3, src: 'now', d: {setai: '独居', aite: ['近所の人', '家族'], hindo: '週1回程度', tayoreru: 'いる', kodoku: 'ときどき'}, note: '娘は市外。電話は週1回'});
  Object.assign(r.items.katsudo, {level: 3, src: 'now', d: {gaishutsu: '週1回程度', sanka: ['特になし'], idou: ['家族の送迎', '徒歩・自転車'], fuyu: 'ほとんどできない'}});

  Object.assign(r.items.ikigai, {level: 1, src: 'now', d: {suki: ['畑・園芸', '料理・食', 'おしゃべり'], tokui: '漬物づくり（野沢菜）', taisetsu: '畑と仏壇を守ること', yaritai: '昔のように誰かと一緒に漬物を漬けたい', yakudatsu: 'ある'}});
  Object.assign(r.items.kibo, {level: 3, src: 'now', d: {soudan: ['健康・病気', '生活・家事'], iyoku: '勧められれば', shokai: '希望する', joken: ['近所', '送迎あり', '午前']}});
  r.kizuki = [{id: uid(), t: Date.now(), rel: 65, text: '昔の話が生き生き', cat: 'ikigai'}, {id: uid(), t: Date.now(), rel: 200, text: '家族の話で表情が変わる', cat: 'kokoro'}, {id: uid(), t: Date.now(), rel: 420, text: '漬物の話で表情が明るくなる', cat: 'ikigai'}];
  r.transcript = [{t: Date.now(), rel: 60, text: '昔は近所のみんなで野沢菜を漬けたもんだけど、今は一人だからねえ'}, {t: Date.now(), rel: 190, text: '主人が去年亡くなってから夜はなかなか眠れなくて'},
    {t: Date.now(), rel: 400, text: '畑はまだやってるよ。でも冬は雪で外に出られないから話す人もいない'}, {t: Date.now(), rel: 520, text: '膝が痛いから、冬に病院へ行くのが心配でね'}];
  const nv = (NAVI && NAVI.items || []).find(x => x.cats.includes('高齢者の通いの場') && x.regs.includes('松代'));

/* ---------------- 起動 ---------------- */
(async function init(){
  try { await DB.load(); }
  catch(e){ $('#app').innerHTML = `<div class="wrap"><div class="notice">データを読み込めませんでした：${esc(e.message)}</div></div>`; return; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  window.addEventListener('online', () => { if (UI.step === 4 && CUR) rerender(); });
  window.addEventListener('offline', () => { if (UI.step === 4 && CUR) rerender(); });
  if (DB.settings.pinHash) showLock();
  route();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.__PWA__) pwaInit();
})();
/* アプリ版（ホーム画面に追加）：オフライン用の保存と、新しい版の通知 */
function pwaInit(){
  navigator.serviceWorker.register('sw.js').then(reg => {
    const notify = w => {
      if (!navigator.serviceWorker.controller) return;   // 初回インストール時は通知しない
      const bar = document.createElement('div'); bar.className = 'toast show'; bar.style.pointerEvents = 'auto'; bar.style.bottom = '90px';
      bar.innerHTML = '新しい版があります <button class="btn sm yel" style="margin-left:8px;min-height:32px">更新する</button>';
      bar.querySelector('button').onclick = () => { if (REC.on) { toast('録音を停止してから更新してください'); return; } DB.flush(); w.postMessage({type: 'SKIP_WAITING'}); };
      document.body.appendChild(bar);
    };
    if (reg.waiting) notify(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed') notify(w); }); });
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }).catch(() => {});
}
